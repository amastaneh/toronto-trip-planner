let selected=0;const $=id=>document.getElementById(id);function render(){let d=data[selected];$('heroImg').src=dayImages[selected];$('heroImg').alt='تصویر یادآور '+d.title;$('days').innerHTML=data.map((x,i)=>`<button class="day ${i===selected?'active':''}" onclick="selected=${i};render()">${x.label}<br><b>${x.num}</b></button>`).join('');$('date').textContent=d.date;$('title').textContent=d.title;$('desc').textContent=d.desc;$('notice').textContent=d.notice;$('notice').style.display=d.notice?'block':'none';let done=d.stops.filter((s,i)=>localStorage.getItem('trip-'+selected+'-'+i)==='1').length;$('summary').innerHTML=`<span class="chip">${d.stops.length} توقف</span><span class="chip">${done} انجام‌شده</span><span class="chip">${d.mode==='driving'?'🚗 خودرو':'🚶 پیاده‌روی / حمل‌ونقل'}</span>`;$('actions').innerHTML=d.stops.length?`<a class="btn" target="_blank" rel="noopener" href="${route(d)}">🧭 مسیر روز در Google Maps ↗</a><a class="btn alt" target="_blank" rel="noopener" href="${loc(d.stops[0].address)}">📍 اولین مقصد ↗</a>`:'';$('stops').innerHTML=d.stops.length?d.stops.map((s,i)=>`<div class="stop"><input class="check" type="checkbox" aria-label="بازدید شد" ${localStorage.getItem('trip-'+selected+'-'+i)==='1'?'checked':''} onchange="localStorage.setItem('trip-${selected}-${i}',this.checked?'1':'0');updateCount()"><div class="time">${s.time}</div><div class="details"><strong>${s.name}${s.optional?' ◦':''}</strong><small>${s.note||s.address}</small><div class="links"><a class="btn alt" target="_blank" rel="noopener" href="${loc(s.address)}">📍 موقعیت</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q(s.address)}">↗ مسیریابی</a></div></div></div>`).join(''):'<div class="empty">🎉 امروز روز مهمانی است؛ برنامه گردش نداریم.</div>'; }function updateCount(){let d=data[selected];$('summary').children[1].textContent=d.stops.filter((s,i)=>localStorage.getItem('trip-'+selected+'-'+i)==='1').length+' انجام‌شده'}render();</script></body></html>
